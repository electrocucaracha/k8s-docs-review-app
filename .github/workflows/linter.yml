name: Lint Code Base
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
permissions: read-all
jobs:
  get-sloc:
    name: Count Lines of Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.20.0"
      - name: Install dependencies
        run: go install github.com/boyter/scc/v3@latest
      - name: Run scc tool
        run: scc --format wide
  check-broken-links:
    name: Check documentation external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check broken links
        # yamllint disable-line rule:line-length
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
  check-super-linter:
    name: Check syntax (super-linter)
    permissions:
      contents: read
      models: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@8f0fa8c0acf90de07569a66d774498c3101d235f # v12.1.1
    with:
      # Oxlint/tsc own TS/TSX; Stylelint owns CSS; Black owns Python formatting.
      # Pre-commit needs npm dependencies; Clippy needs Tauri's native libraries.
      # The shared workflow cannot create commit statuses with its read-only token.
      validate_overrides: |-
        {
          "VALIDATE_BIOME_FORMAT": false,
          "VALIDATE_BIOME_LINT": false,
          "VALIDATE_TYPESCRIPT_ES": false,
          "VALIDATE_TSX": false,
          "VALIDATE_PRE_COMMIT": false,
          "VALIDATE_PYTHON_RUFF_FORMAT": false,
          "VALIDATE_RUST_2015": false,
          "VALIDATE_RUST_2018": false,
          "VALIDATE_RUST_2024": false,
          "VALIDATE_RUST_CLIPPY": false,
          "MARKDOWN_CONFIG_FILE": ".markdownlint.yml",
          "MULTI_STATUS": false,
          "SAVE_SUPER_LINTER_SUMMARY": true
        }
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
