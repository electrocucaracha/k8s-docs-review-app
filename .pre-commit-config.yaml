default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-ast

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npm run lint
        language: system
        types: [ts, tsx]
        pass_filenames: false
      - id: ai-prepare-commit
        name: generate commit message with AI
        entry: uv run prepare-commit --log-level DEBUG
        verbose: true
        log_file: /tmp/prepare-commit.log
        language: system
        stages:
          - prepare-commit-msg
